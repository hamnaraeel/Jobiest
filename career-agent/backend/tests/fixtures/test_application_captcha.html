<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Test Application Form - CAPTCHA</title>
</head>
<body>
<h1>Apply for Software Engineer</h1>
<p>Please verify you are human before continuing.</p>
<div class="g-recaptcha" data-sitekey="test-sitekey-not-real"></div>
<form id="application-form">
  <label for="full-name">Full Name</label>
  <input type="text" id="full-name" name="full_name" required>
  <button type="submit">Continue</button>
</form>
</body>
</html>
